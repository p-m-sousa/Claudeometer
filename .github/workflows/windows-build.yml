name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT_NAME: ${{ vars.SIGNING_ACCOUNT_NAME }}
          SIGNING_CERTIFICATE_PROFILE: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          SIGNING_PUBLISHER_SUBJECT: ${{ vars.SIGNING_PUBLISHER_SUBJECT }}
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT_NAME', 'SIGNING_CERTIFICATE_PROFILE', 'SIGNING_PUBLISHER_SUBJECT')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Release signing is not configured. Missing repository variables: $($missing -join ', '). See SIGNING.md."
          }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Select artifact version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "0.2.4-ci.$env:GITHUB_RUN_NUMBER"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: dotnet restore src/ClaudeUsage.WinForms/ClaudeUsage.WinForms.csproj

      - name: Build
        shell: pwsh
        run: dotnet build src/ClaudeUsage.WinForms/ClaudeUsage.WinForms.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Verify no-elevation manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'src/ClaudeUsage.WinForms/app.manifest' -Raw
          if ($manifest -notmatch 'requestedExecutionLevel\s+level="asInvoker"') {
            throw 'The executable manifest must request asInvoker.'
          }
          if ($manifest -match 'requireAdministrator|highestAvailable') {
            throw 'The executable manifest contains an elevation level.'
          }

      - name: Verify installer is user-scoped
        shell: pwsh
        run: |
          $installer = Get-Content -LiteralPath 'packaging/install.cmd' -Raw
          if ($installer -notmatch '%LOCALAPPDATA%\\Programs\\') {
            throw 'The installer destination is not under LOCALAPPDATA.'
          }
          if ($installer -match 'HKLM|runas') {
            throw 'The installer contains a machine-wide or elevation marker.'
          }

      - name: Run tests
        shell: pwsh
        run: |
          $testProjects = @(Get-ChildItem -Path tests -Filter '*.csproj' -File -Recurse -ErrorAction SilentlyContinue)
          if ($testProjects.Count -eq 0) {
            Write-Host 'No test projects found; skipping dotnet test.'
          }
          foreach ($testProject in $testProjects) {
            $projectXml = Get-Content -LiteralPath $testProject.FullName -Raw
            if ($projectXml -match '<IsTestProject>true</IsTestProject>') {
              dotnet test $testProject.FullName --configuration Release
            } elseif ($projectXml -match '<OutputType>Exe</OutputType>') {
              dotnet run --project $testProject.FullName --configuration Release
            } else {
              Write-Host "Skipping non-test project $($testProject.FullName)"
              continue
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test signed release safeguards
        shell: pwsh
        run: ./scripts/test-release-signatures.ps1

      - name: Sign in to Azure for release signing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign release executable and library
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src\ClaudeUsage.WinForms\bin\Release\net48
          files-folder-filter: ClaudeUsage.exe,ClaudeUsage.*.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify release signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.SIGNING_PUBLISHER_SUBJECT }}
        run: ./scripts/verify-release-signatures.ps1 -Directory 'src/ClaudeUsage.WinForms/bin/Release/net48' -ExpectedPublisherSubject $env:EXPECTED_PUBLISHER

      - name: Run application self-test
        shell: pwsh
        run: |
          $exe = 'src/ClaudeUsage.WinForms/bin/Release/net48/ClaudeUsage.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected executable not found: $exe"
          }
          # ClaudeUsage.exe uses the Windows GUI subsystem. Start-Process is
          # required so PowerShell waits and exposes its actual exit code.
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Application self-test failed with exit code $($process.ExitCode)."
          }

      - name: Package portable release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          EXPECTED_PUBLISHER: ${{ vars.SIGNING_PUBLISHER_SUBJECT }}
        run: |
          $options = @{ NoBuild = $true; Version = $env:RELEASE_VERSION }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $options.RequireSigned = $true
            $options.ExpectedPublisherSubject = $env:EXPECTED_PUBLISHER
          }
          ./scripts/package-release.ps1 @options

      - name: Verify signatures in release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          EXPECTED_PUBLISHER: ${{ vars.SIGNING_PUBLISHER_SUBJECT }}
        run: |
          $archive = "artifacts/ClaudeUsage-$env:RELEASE_VERSION-win-anycpu.zip"
          $extracted = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive -LiteralPath $archive -DestinationPath $extracted
            ./scripts/verify-release-signatures.ps1 -Directory $extracted -ExpectedPublisherSubject $env:EXPECTED_PUBLISHER
          } finally {
            if (Test-Path -LiteralPath $extracted) { Remove-Item -LiteralPath $extracted -Recurse -Force }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsage-${{ steps.version.outputs.value }}-win-anycpu
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath 'artifacts' -File |
              Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.zip.sha256' } |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -ne 2) {
            throw "Expected one ZIP and one SHA-256 file, found $($assets.Count)."
          }

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "Claudeometer $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
